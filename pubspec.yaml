name: vision_assist
description: A vision assistant mobile application for visually impaired individuals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  permission_handler: ^11.3.1
  camera: ^0.10.5+9
  flutter_tts: ^4.0.2
  tflite_flutter: ^0.12.0
  image: ^4.2.0
  google_mlkit_text_recognition: ^0.17.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/sounds/
